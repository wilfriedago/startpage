<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local-first startpage: clock, agenda, tasks, and sound." />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var stored = localStorage.getItem('helium-start:theme')
          var theme = stored ? JSON.parse(stored) : 'system'
          if (theme !== 'system') {
            root.setAttribute('data-theme', theme)
          }
          var style = localStorage.getItem('helium-start:root-style')
          if (style) {
            root.style.cssText = JSON.parse(style)
          }
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          root.style.backgroundColor =
            root.style.getPropertyValue('--bg1') || (dark ? '#0E1123' : '#FBFCFF')
          if (!root.style.colorScheme) {
            root.style.colorScheme = dark ? 'dark' : 'light'
          }
        } catch (error) {
          /* Private mode, or nothing stored yet: the stylesheet default stands. */
        }
      })()
    </script>

    />

</html>
