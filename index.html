<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local-first startpage: clock, agenda, tasks, and sound." />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <script>
      /*
       * Restores the stored look before the first paint. React applies theme and
       * appearance from an effect, which runs *after* the browser has painted —
       * so without this the page paints the stylesheet default (white on a light
       * system) and only then corrects itself, which reads as a flash on every
       * new tab.
       *
       * It replays what `applyAppearance` already resolved rather than
       * recomputing anything, so it cannot drift from `src/lib/appearance.ts`.
       * `src/boot.test.ts` holds the two together.
       */
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("helium-start:theme");
          if (theme && JSON.parse(theme) !== "system") {
            root.setAttribute("data-theme", JSON.parse(theme));
          }
          var style = localStorage.getItem("helium-start:root-style");
          if (style) {
            root.style.cssText = JSON.parse(style);
          }
        } catch (error) {
          /* Private mode, or nothing stored yet: the stylesheet default stands. */
        }
      })();
    </script>
